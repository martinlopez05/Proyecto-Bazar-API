spring.application.name=proyectoventasbazar
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url= jdbc:mysql://db:3306/proyecto_bazar?serverTimezone=UTC
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password= ${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=false
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.deserialization.USE_JAVA_ARRAY_FOR_JSON_ARRAY=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

security.jwt.secret=clave-jwt
security.jwt.user.generator= AUTH-USER-JWT


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.resolve-schema-properties=false
springdoc.swagger-ui.operationsSorter=alpha
